<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>calcunt</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700&family=Saira:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="calcunt.css?v=0.4.2">
</head>
<body>
  <div class="container">
    <h1 class="brand-logo">
      <!-- the whole logo (shape, gradients, border, font) lives in one
           place: assets/logo.svg — edit that file only, nothing here.
           <object> (not <img>) so the SVG's own @font-face import for
           Saira actually loads, same as the favicon copy does. -->
      <object type="image/svg+xml" data="assets/logo.svg" aria-label="calcunt"></object>
    </h1>

    <div class="tabbar-row">
      <nav class="tabs" id="main-tabs">
        <button class="tab-btn" data-tab="today">dia</button>
        <button class="tab-btn" data-tab="week">sem</button>
        <button class="tab-btn" data-tab="month">mês</button>
        <button class="tab-btn" data-tab="year">ano</button>
        <button class="tab-btn" data-tab="times">horários</button>
        <button class="tab-btn" data-tab="trends">tendências</button>
      </nav>

      <!-- on/off toggle, aggregate (off) vs. per-meal (on); only meaningful
           on day/week/month/year, initTabs shows/hides this per active tab. -->
      <button class="meal-toggle meal-toggle-inactive" id="meal-toggle" type="button" aria-pressed="false" tabindex="-1">refeições</button>
    </div>

    <section id="tab-today" class="tab-panel">
      <p id="today-status" hidden></p>
      <div id="today-content" class="metric-grid"></div>
    </section>

    <section id="tab-week" class="tab-panel" hidden>
      <p id="week-status" hidden></p>
      <div id="week-charts" class="metric-grid" hidden></div>
    </section>

    <section id="tab-month" class="tab-panel" hidden>
      <p id="month-status" hidden></p>
      <div id="month-charts" class="metric-grid" hidden></div>
    </section>

    <section id="tab-year" class="tab-panel" hidden>
      <p id="year-status" hidden></p>
      <div id="year-charts" class="metric-grid" hidden></div>
    </section>

    <section id="tab-times" class="tab-panel" hidden>
      <p id="times-status" hidden></p>
      <div class="card times-card" id="times-card" hidden>
        <div class="times-header">
          <div>
          <!-- using this empty div to level the legend -->
          </div>
          <div class="meal-legend" id="times-legend" aria-label="Cores das refeições"></div>
        </div>
        <div class="times-chart-scroll" aria-label="Tabela de horários">
          <div id="times-chart"></div>
        </div>
      </div>
    </section>

    <section id="tab-trends" class="tab-panel" hidden>
      <p id="all-status" hidden></p>
      <div id="all-content" class="metric-grid" hidden></div>
      <div id="all-legend" class="dev-legend" hidden></div>
      <div id="trend-insights" class="metric-grid trend-insights" hidden></div>
    </section>

    <footer class="site-footer">
      <div>&copy; 2026 Henrique de Carvalho</div>
      <div>v0.4.2 · <a href="https://github.com/ocabra/calcunt">use calcunt</a></div>
    </footer>
  </div>
  <div id="bar-tooltip" class="bar-tooltip" hidden></div>

  <script src="activity-ring.js?v=0.4.2"></script>
  <script type="module" src="view.js?v=0.4.2"></script>
</body>
</html>
